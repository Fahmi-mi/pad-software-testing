# ================================================
# Konfigurasi ExtentReports (HTML report otomatis)
# File ini WAJIB ada di src/test/resources/
# ================================================

# Aktifkan Spark reporter (menghasilkan file HTML)
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-reports/TentangDental_TestReport.html

# Judul dan tema laporan
extent.reporter.spark.config.reportName=Laporan Pengujian — Form Reservasi Tentang Dental
extent.reporter.spark.config.documentTitle=Tentang Dental Test Report
extent.reporter.spark.config.theme=DARK

# Aktifkan timeline di report
extent.reporter.spark.config.enableTimeline=true

# Folder screenshot (jika ada kegagalan)
screenshot.dir=target/extent-reports/screenshots/
screenshot.rel.path=screenshots/
